<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Task Manager</title>
    <link rel="stylesheet" href="/assets/app.css" />
    <link rel="preconnect" href="/fonts" />
  </head>
  <body class="bg-base text-ink font-sans antialiased">
    <div
      x-data="app()"
      x-cloak
      @keydown.escape.window="closeModals()"
      class="h-screen flex flex-col overflow-hidden"
    >
      <!-- Topbar -->
      <header
        class="relative z-50 h-14 shrink-0 flex items-center gap-2 sm:gap-3 px-3 sm:px-4 border-b border-border bg-panel/80 backdrop-blur"
      >
        <button
          @click="sidebarOpen=!sidebarOpen"
          x-show="viewMode!=='master' && viewMode!=='calendar'"
          class="md:hidden p-1.5 rounded-md text-muted hover:text-ink hover:bg-panel2 transition shrink-0"
          title="Menú"
        >
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>

        <button
          @click="toggleSidebar()"
          x-show="viewMode!=='master' && viewMode!=='calendar'"
          class="hidden md:inline-flex p-1.5 rounded-md text-muted hover:text-ink hover:bg-panel2 transition shrink-0"
          :title="sidebarCollapsed ? 'Mostrar sidebar' : 'Ocultar sidebar'"
        >
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/></svg>
        </button>

        <div class="flex items-center gap-2 font-semibold tracking-tight shrink-0">
          <div class="w-6 h-6 rounded-md bg-accent/20 flex items-center justify-center">
            <span class="w-2.5 h-2.5 rounded-sm bg-accent2"></span>
          </div>
          <span class="hidden sm:inline">Tasks</span>
        </div>

        <div class="h-5 w-px bg-border hidden sm:block"></div>

        <!-- Selector de vista -->
        <div class="flex items-center gap-1 p-0.5 rounded-lg bg-panel2 border border-border">
          <template x-for="v in views" :key="v.id">
            <button
              @click="switchView(v.id)"
              :class="viewMode===v.id ? 'bg-accent/20 text-ink' : 'text-muted hover:text-ink'"
              class="px-2.5 sm:px-3 py-1 text-sm rounded-md transition"
              x-text="v.label"
            ></button>
          </template>
        </div>

        <div class="ml-auto flex items-center gap-2">
          <button
            @click="showProjModal=true"
            class="px-2.5 sm:px-3 py-1.5 text-sm rounded-lg border border-border2 hover:bg-panel2 text-muted hover:text-ink transition"
          >
            <span class="sm:hidden">+Pr</span><span class="hidden sm:inline">+ Proyecto</span>
          </button>
          <button
            x-show="currentProjectId"
            @click="showBoardModal=true"
            class="px-2.5 sm:px-3 py-1.5 text-sm rounded-lg border border-border2 hover:bg-panel2 text-muted hover:text-ink transition"
          >
            <span class="sm:hidden">+Tb</span><span class="hidden sm:inline">+ Tablero</span>
          </button>
        </div>
      </header>

      <div class="flex flex-1 min-h-0">
        <!-- Backdrop móvil para el sidebar -->
        <div
          x-show="sidebarOpen && viewMode!=='master' && viewMode!=='calendar'"
          @click="sidebarOpen=false"
          class="fixed inset-0 bg-black/50 z-30 md:hidden"
        ></div>

        <!-- Zona de hover para revelar el sidebar cuando está colapsado (solo escritorio) -->
        <div
          x-show="sidebarCollapsed && viewMode!=='master' && viewMode!=='calendar'"
          @mouseenter="sidebarHover=true"
          @mouseleave="sidebarHover=false"
          class="hidden md:block fixed inset-y-0 left-0 z-30 w-4 cursor-pointer"
        ></div>

        <!-- Sidebar -->
        <aside
          class="fixed inset-y-0 left-0 z-40 w-64 shrink-0 border-r border-border bg-panel/95 md:bg-panel/40 overflow-y-auto px-2 pt-16 md:pt-3 pb-3 transition-transform duration-200"
          :class="sidebarClasses()"
          @mouseenter="sidebarHover=true"
          @mouseleave="sidebarHover=false"
          x-show="viewMode!=='master' && viewMode!=='calendar'"
        >
          <div class="px-2 text-xs uppercase tracking-wider text-faint mb-2">Proyectos</div>
          <template x-for="p in projects" :key="p.id">
            <div class="mb-1 group/proj">
              <div class="flex items-center gap-1">
                <button
                  @click="selectProject(p.id)"
                  :class="currentProjectId===p.id ? 'bg-panel2 text-ink' : 'text-muted hover:bg-panel2/60'"
                  class="flex-1 flex items-center justify-between px-2 py-1.5 rounded-md text-sm transition"
                >
                  <span class="truncate" x-text="p.name"></span>
                  <span class="text-faint text-xs" x-text="boardsByProject(p.id).length"></span>
                </button>
                <div class="hidden group-hover/proj:flex items-center gap-0.5 pr-1">
                  <button
                    @click.stop="openRename('project', p.id, p.name)"
                    title="Renombrar proyecto"
                    class="px-1.5 text-faint hover:text-ink transition"
                  >✎</button>
                  <button
                    @click.stop="deleteProject(p.id)"
                    title="Eliminar proyecto"
                    class="px-1.5 text-faint hover:text-red-400 transition"
                  >✕</button>
                </div>
              </div>
              <div x-show="currentProjectId===p.id" class="ml-3 mt-0.5 space-y-0.5">
                <template x-for="b in boardsByProject(p.id)" :key="b.id">
                  <div class="group/board flex items-center gap-1">
                    <button
                      @click="selectBoard(b.id)"
                      :class="currentBoardId===b.id ? 'text-ink bg-panel2/50' : 'text-faint hover:text-muted'"
                      class="flex-1 text-left px-2 py-1 rounded-md text-[13px] truncate transition"
                      x-text="b.name"
                    ></button>
                    <div class="hidden group-hover/board:flex items-center gap-0.5 pr-1">
                      <button
                        @click.stop="openRename('board', b.id, b.name)"
                        title="Renombrar tablero"
                        class="px-1 text-faint hover:text-ink transition"
                      >✎</button>
                      <button
                        @click.stop="deleteBoard(b.id)"
                        title="Eliminar tablero"
                        class="px-1 text-faint hover:text-red-400 transition"
                      >✕</button>
                    </div>
                  </div>
                </template>
              </div>
            </div>
          </template>
          <div x-show="!projects.length" class="px-2 text-xs text-faint">
            Aún no hay proyectos.
          </div>
        </aside>

        <!-- Main -->
        <main class="flex-1 min-w-0 overflow-hidden flex flex-col">
          <!-- Título del tablero -->
          <div
            class="h-auto shrink-0 flex flex-wrap items-center gap-2 sm:gap-3 px-3 sm:px-5 py-2 sm:py-0 border-b border-border"
            x-show="viewMode!=='master' && viewMode!=='calendar'"
          >
            <h1 class="font-medium truncate" x-text="currentBoard()?.name || 'Sin tablero'"></h1>
            <span class="text-xs text-faint" x-text="boardTaskCount() + ' tareas'"></span>
            <div class="ml-auto flex items-center gap-2">
              <button
                x-show="currentBoardId"
                @click="openRename('board', currentBoardId, currentBoard()?.name)"
                title="Renombrar tablero"
                class="px-2.5 py-1.5 text-sm rounded-lg border border-border2 hover:bg-panel2 text-muted hover:text-ink transition"
              >✎</button>
              <button
                x-show="currentBoardId"
                @click="deleteBoard(currentBoardId)"
                title="Eliminar tablero"
                class="px-2.5 py-1.5 text-sm rounded-lg border border-border2 hover:bg-panel2 text-muted hover:text-red-400 transition"
              >✕</button>
              <button
                @click="showTaskModal=true"
                x-show="currentBoardId"
                class="px-3 py-1.5 text-sm rounded-lg bg-accent/20 border border-accent/30 hover:bg-accent/30 text-ink transition"
              >
                + Tarea
              </button>
            </div>
          </div>

          <!-- Vista Kanban -->
          <div
            x-show="viewMode==='kanban'"
            class="flex-1 overflow-auto p-4"
          >
            <div class="flex gap-4 items-start" x-show="currentBoardId">
              <template x-for="col in board.columns" :key="col.status.id">
                <div
                  class="w-72 shrink-0 flex flex-col bg-panel/60 border border-border rounded-xl2"
                >
                  <div
                    class="flex items-center gap-2 px-3 py-2.5 border-b border-border"
                  >
                    <span
                      class="w-2.5 h-2.5 rounded-full"
                      :style="`background:${col.status.color}`"
                    ></span>
                    <span class="text-sm font-medium" x-text="col.status.name"></span>
                    <span
                      class="ml-auto text-xs text-faint"
                      x-text="col.tasks.length"
                    ></span>
                  </div>
                  <div
                    class="p-2 space-y-2 min-h-[44px]"
                    :data-status="col.status.id"
                    x-ref="lists"
                  >
                    <template x-for="t in col.tasks" :key="t.id">
                      <div
                        class="group card-shadow rounded-lg bg-panel2 border border-border2 p-3 cursor-grab active:cursor-grabbing hover:border-border2/80 transition"
                        :data-task="t.id"
                      >
                        <div class="text-sm text-ink leading-snug" x-text="t.title"></div>
                        <p
                          x-show="t.description"
                          class="text-xs text-muted mt-1 line-clamp-2"
                          x-text="t.description"
                        ></p>
                        <div class="flex items-center gap-2 mt-2">
                          <span
                            class="text-[10px] uppercase tracking-wide px-1.5 py-0.5 rounded bg-panel border border-border text-faint"
                            :class="{'text-accent2': t.priority==='high','text-amber-300': t.priority==='medium'}"
                            x-text="t.priority"
                          ></span>
                          <span
                            x-show="t.due_date"
                            class="text-[11px] text-faint"
                            x-text="t.due_date"
                          ></span>
                          <button
                            @click.stop="openTaskEdit(t)"
                            class="text-faint hover:text-ink opacity-0 group-hover:opacity-100 transition"
                            title="Editar"
                          >
                            ✎
                          </button>
                          <button
                            @click.stop="deleteTask(t.id)"
                            class="ml-auto text-faint hover:text-red-400 opacity-0 group-hover:opacity-100 transition"
                            title="Eliminar"
                          >
                            ✕
                          </button>
                        </div>
                        <div class="flex flex-wrap gap-1 mt-2" x-show="t.tags && t.tags.length">
                          <template x-for="tag in t.tags" :key="tag">
                            <span
                              class="text-[10px] px-1.5 py-0.5 rounded bg-accent/10 border border-accent/25 text-accent2"
                              x-text="tag"
                            ></span>
                          </template>
                        </div>
                      </div>
                    </template>
                  </div>
                </div>
              </template>
            </div>
            <div
              x-show="!currentBoardId"
              class="h-full flex items-center justify-center text-faint text-sm"
            >
              Selecciona o crea un tablero para empezar.
            </div>
          </div>

          <!-- Vista Tabla (por tablero) -->
          <div x-show="viewMode==='table'" class="flex-1 overflow-auto p-4">
            <!-- Filtros (mismos que la Master Table global) -->
            <div
              class="flex flex-wrap items-end gap-3 mb-3"
              x-show="currentBoardId"
            >
              <label class="text-xs text-faint flex flex-col gap-1">
                Estado
                <select x-model="boardFilter.status" class="bg-panel2 border border-border2 rounded-md px-2 py-1.5 text-sm">
                  <option value="">Todos</option>
                  <template x-for="col in board.columns" :key="col.status.id">
                    <option :value="col.status.name" x-text="col.status.name"></option>
                  </template>
                </select>
              </label>
              <label class="text-xs text-faint flex flex-col gap-1">
                Prioridad
                <select x-model="boardFilter.priority" class="bg-panel2 border border-border2 rounded-md px-2 py-1.5 text-sm">
                  <option value="">Todas</option>
                  <option value="none">none</option>
                  <option value="low">low</option>
                  <option value="medium">medium</option>
                  <option value="high">high</option>
                </select>
              </label>
              <label class="text-xs text-faint flex flex-col gap-1">
                Etiqueta
                <select x-model="boardFilter.tag" class="bg-panel2 border border-border2 rounded-md px-2 py-1.5 text-sm">
                  <option value="">Todas</option>
                  <template x-for="tag in boardTags()" :key="tag">
                    <option :value="tag" x-text="tag"></option>
                  </template>
                </select>
              </label>
              <label class="text-xs text-faint flex flex-col gap-1">
                Desde
                <input type="date" x-model="boardFilter.from" class="bg-panel2 border border-border2 rounded-md px-2 py-1.5 text-sm text-ink" />
              </label>
              <label class="text-xs text-faint flex flex-col gap-1">
                Hasta
                <input type="date" x-model="boardFilter.to" class="bg-panel2 border border-border2 rounded-md px-2 py-1.5 text-sm text-ink" />
              </label>
              <button @click="resetBoardFilters()" class="px-3 py-1.5 text-sm rounded-lg border border-border2 hover:bg-panel2 text-muted">
                Limpiar
              </button>
              <span class="text-xs text-faint" x-text="filteredBoardTasks().length + ' tareas'"></span>
            </div>
            <table
              class="w-full text-sm border-collapse min-w-[560px]"
              x-show="currentBoardId"
            >
              <thead>
                <tr class="text-left text-faint border-b border-border">
                  <th class="py-2 px-3 font-medium cursor-pointer select-none hover:text-ink transition" @click="boardSortBy('title')">
                    Título <span x-show="boardFilter.sort==='title'" x-text="boardFilter.order==='asc'?'▲':'▼'" class="text-accent2"></span>
                  </th>
                  <th class="py-2 px-3 font-medium cursor-pointer select-none hover:text-ink transition" @click="boardSortBy('status')">
                    Estado <span x-show="boardFilter.sort==='status'" x-text="boardFilter.order==='asc'?'▲':'▼'" class="text-accent2"></span>
                  </th>
                  <th class="py-2 px-3 font-medium cursor-pointer select-none hover:text-ink transition" @click="boardSortBy('priority')">
                    Prioridad <span x-show="boardFilter.sort==='priority'" x-text="boardFilter.order==='asc'?'▲':'▼'" class="text-accent2"></span>
                  </th>
                  <th class="py-2 px-3 font-medium">Etiquetas</th>
                  <th class="py-2 px-3 font-medium cursor-pointer select-none hover:text-ink transition" @click="boardSortBy('due_date')">
                    Vence <span x-show="boardFilter.sort==='due_date'" x-text="boardFilter.order==='asc'?'▲':'▼'" class="text-accent2"></span>
                  </th>
                </tr>
              </thead>
              <tbody>
                <template x-for="t in filteredBoardTasks()" :key="t.id">
                  <tr class="border-b border-border/60 hover:bg-panel2/40">
                    <td class="py-2 px-3" x-text="t.title"></td>
                    <td class="py-2 px-3">
                      <select
                        class="bg-panel2 border border-border2 rounded-md px-2 py-1 text-xs"
                        :value="t.status_id"
                        @change="moveTask(t.id, $event.target.value)"
                      >
                        <template
                          x-for="col in board.columns"
                          :key="col.status.id"
                        >
                          <option
                            :value="col.status.id"
                            x-text="col.status.name"
                          ></option>
                        </template>
                      </select>
                    </td>
                    <td class="py-2 px-3">
                      <select
                        class="bg-panel2 border border-border2 rounded-md px-2 py-1 text-xs"
                        :value="t.priority"
                        @change="patchTask(t.id, {priority: $event.target.value})"
                      >
                        <option value="none">none</option>
                        <option value="low">low</option>
                        <option value="medium">medium</option>
                        <option value="high">high</option>
                      </select>
                    </td>
                    <td class="py-2 px-3">
                      <div class="flex flex-wrap gap-1">
                        <template x-for="tag in t.tags" :key="tag">
                          <span
                            class="text-[10px] px-1.5 py-0.5 rounded bg-accent/10 border border-accent/25 text-accent2"
                            x-text="tag"
                          ></span>
                        </template>
                      </div>
                    </td>
                    <td class="py-2 px-3 text-faint" x-text="t.due_date || '—'"></td>
                    <td class="py-2 px-3">
                      <div class="flex items-center gap-1">
                        <button
                          @click="openTaskEdit(t)"
                          class="text-faint hover:text-ink transition"
                          title="Editar"
                        >✎</button>
                        <button
                          @click="deleteTask(t.id)"
                          class="text-faint hover:text-red-400 transition"
                          title="Eliminar"
                        >✕</button>
                      </div>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>

          <!-- Master Table global -->
          <div x-show="viewMode==='master'" class="flex-1 overflow-auto flex flex-col">
            <!-- Filtros -->
            <div class="shrink-0 flex flex-wrap items-end gap-3 p-4 border-b border-border">
              <label class="text-xs text-faint flex flex-col gap-1">
                Estado
                <select x-model="filters.status" @change="loadMaster()" class="bg-panel2 border border-border2 rounded-md px-2 py-1.5 text-sm">
                  <option value="">Todos</option>
                  <option value="Backlog">Backlog</option>
                  <option value="To Do">To Do</option>
                  <option value="In Progress">In Progress</option>
                  <option value="Done">Done</option>
                </select>
              </label>
              <label class="text-xs text-faint flex flex-col gap-1">
                Prioridad
                <select x-model="filters.priority" @change="loadMaster()" class="bg-panel2 border border-border2 rounded-md px-2 py-1.5 text-sm">
                  <option value="">Todas</option>
                  <option value="none">none</option>
                  <option value="low">low</option>
                  <option value="medium">medium</option>
                  <option value="high">high</option>
                </select>
              </label>
              <label class="text-xs text-faint flex flex-col gap-1">
                Proyecto
                <select x-model="filters.project" @change="loadMaster()" class="bg-panel2 border border-border2 rounded-md px-2 py-1.5 text-sm">
                  <option value="">Todos</option>
                  <template x-for="p in projects" :key="p.id">
                    <option :value="p.name" x-text="p.name"></option>
                  </template>
                </select>
              </label>
              <label class="text-xs text-faint flex flex-col gap-1">
                Etiqueta
                <select x-model="filters.tag" @change="loadMaster()" class="bg-panel2 border border-border2 rounded-md px-2 py-1.5 text-sm">
                  <option value="">Todas</option>
                  <template x-for="tag in tags" :key="tag">
                    <option :value="tag" x-text="tag"></option>
                  </template>
                </select>
              </label>
              <label class="text-xs text-faint flex flex-col gap-1">
                Desde
                <input type="date" x-model="filters.from" @change="loadMaster()" class="bg-panel2 border border-border2 rounded-md px-2 py-1.5 text-sm text-ink" />
              </label>
              <label class="text-xs text-faint flex flex-col gap-1">
                Hasta
                <input type="date" x-model="filters.to" @change="loadMaster()" class="bg-panel2 border border-border2 rounded-md px-2 py-1.5 text-sm text-ink" />
              </label>
              <button @click="resetFilters()" class="px-3 py-1.5 text-sm rounded-lg border border-border2 hover:bg-panel2 text-muted">
                Limpiar
              </button>
              <span class="ml-auto text-xs text-faint" x-text="master.length + ' tareas'"></span>
            </div>

            <!-- Tabla -->
            <table class="w-full text-sm border-collapse min-w-[680px]">
              <thead>
                <tr class="text-left text-faint border-b border-border sticky top-0 bg-base">
                  <th class="py-2 px-3 font-medium cursor-pointer select-none hover:text-ink transition" @click="sortBy('title')">
                    Título <span x-show="filters.sort==='title'" x-text="filters.order==='asc'?'▲':'▼'" class="text-accent2"></span>
                  </th>
                  <th class="py-2 px-3 font-medium cursor-pointer select-none hover:text-ink transition" @click="sortBy('project')">
                    Proyecto <span x-show="filters.sort==='project'" x-text="filters.order==='asc'?'▲':'▼'" class="text-accent2"></span>
                  </th>
                  <th class="py-2 px-3 font-medium cursor-pointer select-none hover:text-ink transition" @click="sortBy('status')">
                    Estado <span x-show="filters.sort==='status'" x-text="filters.order==='asc'?'▲':'▼'" class="text-accent2"></span>
                  </th>
                  <th class="py-2 px-3 font-medium cursor-pointer select-none hover:text-ink transition" @click="sortBy('priority')">
                    Prioridad <span x-show="filters.sort==='priority'" x-text="filters.order==='asc'?'▲':'▼'" class="text-accent2"></span>
                  </th>
                  <th class="py-2 px-3 font-medium">Etiquetas</th>
                  <th class="py-2 px-3 font-medium cursor-pointer select-none hover:text-ink transition" @click="sortBy('due_date')">
                    Vence <span x-show="filters.sort==='due_date'" x-text="filters.order==='asc'?'▲':'▼'" class="text-accent2"></span>
                  </th>
                </tr>
              </thead>
              <tbody>
                <template x-for="t in master" :key="t.id">
                  <tr class="border-b border-border/60 hover:bg-panel2/40">
                    <td class="py-2 px-3 text-ink" x-text="t.title"></td>
                    <td class="py-2 px-3 text-muted" x-text="t.project_name"></td>
                    <td class="py-2 px-3">
                      <select
                        class="bg-panel2 border border-border2 rounded-md px-2 py-1 text-xs"
                        :value="t.status_id"
                        @change="patchTaskGlobal(t.id, {status_id: Number($event.target.value)})"
                      >
                        <template x-for="s in statusesForBoard(t.board_id)" :key="s.id">
                          <option :value="s.id" x-text="s.name"></option>
                        </template>
                      </select>
                    </td>
                    <td class="py-2 px-3">
                      <select
                        class="bg-panel2 border border-border2 rounded-md px-2 py-1 text-xs"
                        :value="t.priority"
                        @change="patchTaskGlobal(t.id, {priority: $event.target.value})"
                      >
                        <option value="none">none</option>
                        <option value="low">low</option>
                        <option value="medium">medium</option>
                        <option value="high">high</option>
                      </select>
                    </td>
                    <td class="py-2 px-3">
                      <div class="flex flex-wrap gap-1">
                        <template x-for="tag in t.tags" :key="tag">
                          <span
                            class="text-[10px] px-1.5 py-0.5 rounded bg-accent/10 border border-accent/25 text-accent2"
                            x-text="tag"
                          ></span>
                        </template>
                      </div>
                    </td>
                    <td class="py-2 px-3 text-faint" x-text="t.due_date || '—'"></td>
                    <td class="py-2 px-3">
                      <div class="flex items-center gap-1">
                        <button
                          @click="openTaskEdit(t)"
                          class="text-faint hover:text-ink transition"
                          title="Editar"
                        >✎</button>
                        <button
                          @click="deleteMasterTask(t.id)"
                          class="text-faint hover:text-red-400 transition"
                          title="Eliminar"
                        >✕</button>
                      </div>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
            <div x-show="!master.length" class="p-8 text-center text-faint text-sm">
              No hay tareas que coincidan con los filtros.
            </div>
          </div>

          <!-- Vista Calendario -->
          <div x-show="viewMode==='calendar'" class="flex-1 overflow-auto flex flex-col">
            <!-- Barra de navegación del mes -->
            <div class="shrink-0 flex items-center gap-1 p-4 border-b border-border">
              <button
                @click="prevMonth()"
                class="p-1.5 rounded-md text-muted hover:text-ink hover:bg-panel2 transition"
                title="Mes anterior"
              >
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
              </button>
              <div class="font-medium min-w-[150px] text-center" x-text="calMonthLabel()"></div>
              <button
                @click="nextMonth()"
                class="p-1.5 rounded-md text-muted hover:text-ink hover:bg-panel2 transition"
                title="Mes siguiente"
              >
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
              </button>
              <button
                @click="goToday()"
                class="px-3 py-1.5 text-sm rounded-lg border border-border2 hover:bg-panel2 text-muted ml-1"
              >Hoy</button>
              <div class="ml-auto flex items-center gap-2">
                <select x-model="calFilter.project" @change="onCalProjectChange()" class="bg-panel2 border border-border2 rounded-md px-2 py-1.5 text-sm">
                  <option value="">Todos los proyectos</option>
                  <template x-for="p in projects" :key="p.id">
                    <option :value="p.name" x-text="p.name"></option>
                  </template>
                </select>
                <select x-model="calFilter.board" @change="loadCalendar()" class="bg-panel2 border border-border2 rounded-md px-2 py-1.5 text-sm">
                  <option value="">Todos los tableros</option>
                  <template x-for="b in calBoardOptions()" :key="b.id">
                    <option :value="b.id" x-text="b.name"></option>
                  </template>
                </select>
                <button
                  x-show="calFilter.project || calFilter.board"
                  @click="resetCalFilters()"
                  class="px-3 py-1.5 text-sm rounded-lg border border-border2 hover:bg-panel2 text-muted"
                  title="Limpiar filtros"
                >Limpiar</button>
                <span class="text-xs text-faint whitespace-nowrap" x-text="calTasksCount() + ' tareas con fecha'"></span>
              </div>
            </div>

            <!-- Grid del mes -->
            <div class="p-4">
              <div class="grid grid-cols-7 gap-px bg-border rounded-xl2 overflow-hidden border border-border">
                <template x-for="wd in ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom']" :key="wd">
                  <div class="bg-panel py-2 text-center text-xs uppercase tracking-wider text-faint" x-text="wd"></div>
                </template>
                <template x-for="week in calWeeks()" :key="week[0].iso">
                  <template x-for="cell in week" :key="cell.iso">
                    <div
                      class="bg-panel min-h-[112px] p-1.5 flex flex-col gap-1"
                      :class="cell.inMonth ? '' : 'opacity-40'"
                    >
                      <div class="flex items-center justify-between">
                        <span
                          class="text-xs text-faint"
                          :class="cell.isToday ? 'text-accent2 font-semibold' : ''"
                          x-text="cell.day"
                        ></span>
                        <span x-show="cell.isToday" class="text-[9px] px-1 rounded bg-accent/20 text-accent2">Hoy</span>
                      </div>
                      <template x-for="t in cell.tasks" :key="t.id">
                        <button
                          @click="openTaskEdit(t)"
                          class="text-left text-[11px] leading-tight rounded px-1.5 py-1 truncate border border-border2 bg-panel2 hover:border-accent/50 transition"
                          :title="t.title"
                        >
                          <span
                            class="inline-block w-1.5 h-1.5 rounded-full mr-1 align-middle"
                            :style="`background:${calStatusColor(t.status_id)}`"
                          ></span>
                          <span x-text="t.title"></span>
                        </button>
                      </template>
                    </div>
                  </template>
                </template>
              </div>
              <div x-show="!calendar.length" class="p-8 text-center text-faint text-sm">
                No hay tareas.
              </div>
            </div>
          </div>
        </main>
      </div>

      <!-- Modal Proyecto -->
      <div
        x-show="showProjModal"
        @click.self="showProjModal=false"
        class="fixed inset-0 bg-black/50 flex items-center justify-center z-50"
      >
        <div class="w-[90vw] max-w-sm bg-panel border border-border2 rounded-xl2 p-4 card-shadow">
          <div class="font-medium mb-3">Nuevo proyecto</div>
          <input
            x-model="projName"
            @keyup.enter="createProject()"
            placeholder="Nombre del proyecto"
            class="w-full bg-panel2 border border-border2 rounded-md px-3 py-2 text-sm mb-3 outline-none focus:border-accent"
          />
          <div class="flex justify-end gap-2">
            <button @click="showProjModal=false" class="px-3 py-1.5 text-sm rounded-lg border border-border2 text-muted">Cancelar</button>
            <button @click="createProject()" class="px-3 py-1.5 text-sm rounded-lg bg-accent/20 border border-accent/30 text-ink">Crear</button>
          </div>
        </div>
      </div>

      <!-- Modal Tablero -->
      <div
        x-show="showBoardModal"
        @click.self="showBoardModal=false"
        class="fixed inset-0 bg-black/50 flex items-center justify-center z-50"
      >
        <div class="w-[90vw] max-w-sm bg-panel border border-border2 rounded-xl2 p-4 card-shadow">
          <div class="font-medium mb-3">Nuevo tablero</div>
          <input
            x-model="boardName"
            @keyup.enter="createBoard()"
            placeholder="Nombre del tablero"
            class="w-full bg-panel2 border border-border2 rounded-md px-3 py-2 text-sm mb-3 outline-none focus:border-accent"
          />
          <div class="flex justify-end gap-2">
            <button @click="showBoardModal=false" class="px-3 py-1.5 text-sm rounded-lg border border-border2 text-muted">Cancelar</button>
            <button @click="createBoard()" class="px-3 py-1.5 text-sm rounded-lg bg-accent/20 border border-accent/30 text-ink">Crear</button>
          </div>
        </div>
      </div>

      <!-- Modal Tarea -->
      <div
        x-show="showTaskModal"
        @click.self="showTaskModal=false"
        class="fixed inset-0 bg-black/50 flex items-center justify-center z-50"
      >
        <div class="w-[90vw] max-w-md bg-panel border border-border2 rounded-xl2 p-4 card-shadow">
          <div class="font-medium mb-3">Nueva tarea</div>
          <input
            x-model="taskTitle"
            @keyup.enter="createTask()"
            placeholder="Título"
            class="w-full bg-panel2 border border-border2 rounded-md px-3 py-2 text-sm mb-2 outline-none focus:border-accent"
          />
          <textarea
            x-model="taskDesc"
            placeholder="Descripción (opcional)"
            class="w-full bg-panel2 border border-border2 rounded-md px-3 py-2 text-sm mb-2 outline-none focus:border-accent resize-none"
            rows="2"
          ></textarea>
           <div class="flex flex-wrap gap-2 mb-3">
             <select x-model="taskStatus" class="bg-panel2 border border-border2 rounded-md px-2 py-2 text-sm flex-1">
               <template x-for="col in board.columns" :key="col.status.id">
                 <option :value="col.status.id" x-text="col.status.name"></option>
               </template>
             </select>
             <select x-model="taskPriority" class="bg-panel2 border border-border2 rounded-md px-2 py-2 text-sm">
               <option value="none">none</option>
               <option value="low">low</option>
               <option value="medium">medium</option>
               <option value="high">high</option>
             </select>
             <input type="date" x-model="taskDue" class="bg-panel2 border border-border2 rounded-md px-2 py-2 text-sm text-ink" />
           </div>
           <input
             x-model="taskTags"
             placeholder="Etiquetas (separadas por coma)"
             class="w-full bg-panel2 border border-border2 rounded-md px-3 py-2 text-sm mb-3 outline-none focus:border-accent"
           />
            <div class="flex justify-end gap-2">
              <button @click="showTaskModal=false" class="px-3 py-1.5 text-sm rounded-lg border border-border2 text-muted">Cancelar</button>
              <button @click="createTask()" class="px-3 py-1.5 text-sm rounded-lg bg-accent/20 border border-accent/30 text-ink">Crear</button>
            </div>
        </div>
      </div>

      <!-- Modal Editar Tarea -->
      <div
        x-show="showTaskEditModal"
        @click.self="showTaskEditModal=false"
        class="fixed inset-0 bg-black/50 flex items-center justify-center z-50"
      >
        <div class="w-[90vw] max-w-md bg-panel border border-border2 rounded-xl2 p-4 card-shadow">
          <div class="font-medium mb-3">Editar tarea</div>
          <input
            x-model="editTask.title"
            @keyup.enter="saveTaskEdit()"
            placeholder="Título"
            class="w-full bg-panel2 border border-border2 rounded-md px-3 py-2 text-sm mb-2 outline-none focus:border-accent"
          />
          <textarea
            x-model="editTask.description"
            placeholder="Descripción (opcional)"
            class="w-full bg-panel2 border border-border2 rounded-md px-3 py-2 text-sm mb-2 outline-none focus:border-accent resize-none"
            rows="3"
          ></textarea>
           <div class="flex flex-wrap gap-2 mb-3">
             <select x-model="editTask.priority" class="bg-panel2 border border-border2 rounded-md px-2 py-2 text-sm flex-1">
               <option value="none">none</option>
               <option value="low">low</option>
               <option value="medium">medium</option>
               <option value="high">high</option>
             </select>
             <input type="date" x-model="editTask.dueDate" class="bg-panel2 border border-border2 rounded-md px-2 py-2 text-sm text-ink" />
           </div>
           <input
             x-model="editTask.tags"
             placeholder="Etiquetas (separadas por coma)"
             class="w-full bg-panel2 border border-border2 rounded-md px-3 py-2 text-sm mb-3 outline-none focus:border-accent"
           />
          <div class="flex flex-wrap gap-2 mb-3" x-show="currentBoardId">
            <select x-model="editTask.statusId" class="bg-panel2 border border-border2 rounded-md px-2 py-2 text-sm flex-1">
              <template x-for="col in board.columns" :key="col.status.id">
                <option :value="col.status.id" x-text="col.status.name"></option>
              </template>
            </select>
          </div>
          <div class="flex justify-end gap-2">
            <button @click="showTaskEditModal=false" class="px-3 py-1.5 text-sm rounded-lg border border-border2 text-muted">Cancelar</button>
            <button @click="saveTaskEdit()" class="px-3 py-1.5 text-sm rounded-lg bg-accent/20 border border-accent/30 text-ink">Guardar</button>
          </div>
        </div>
      </div>

      <!-- Modal Renombrar -->
      <div
        x-show="showRenameModal"
        @click.self="showRenameModal=false"
        class="fixed inset-0 bg-black/50 flex items-center justify-center z-50"
      >
        <div class="w-[90vw] max-w-sm bg-panel border border-border2 rounded-xl2 p-4 card-shadow">
          <div class="font-medium mb-3" x-text="renameType === 'project' ? 'Renombrar proyecto' : 'Renombrar tablero'"></div>
          <input
            x-model="renameName"
            @keyup.enter="doRename()"
            placeholder="Nuevo nombre"
            class="w-full bg-panel2 border border-border2 rounded-md px-3 py-2 text-sm mb-3 outline-none focus:border-accent"
          />
          <div class="flex justify-end gap-2">
            <button @click="showRenameModal=false" class="px-3 py-1.5 text-sm rounded-lg border border-border2 text-muted">Cancelar</button>
            <button @click="doRename()" class="px-3 py-1.5 text-sm rounded-lg bg-accent/20 border border-accent/30 text-ink">Guardar</button>
          </div>
        </div>
      </div>
    </div>

    <style>
      [x-cloak] { display: none !important; }
    </style>
    <script>
      // El bfcache (caché de navegación) puede restaurar el DOM con un modal
      // abierto y sin re-ejecutar init(). Forzamos el cierre en ese caso.
      window.addEventListener("pageshow", function (e) {
        if (e.persisted && window.Alpine) {
          var el = document.querySelector("[x-data]");
          if (el) {
            var d = Alpine.$data(el);
            d.showProjModal = false;
            d.showBoardModal = false;
            d.showTaskModal = false;
            d.showRenameModal = false;
            d.showTaskEditModal = false;
          }
        }
      });
    </script>
    <script src="/assets/vendor/htmx.min.js"></script>
    <script src="/assets/vendor/sortable.min.js"></script>
    <script src="/assets/app.js"></script>
    <script src="/assets/vendor/alpine.min.js" defer></script>
  </body>
</html>
